<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Panna Cotta">
    <meta name="theme-color" content="#EFE7D6" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#15161a" media="(prefers-color-scheme: dark)">
    <title>Panna Cotta</title>
    <link rel="manifest" href="/apps/manifest.json">
    <link rel="icon" href="/apps/assets/favicon.ico">
    <link rel="apple-touch-icon" href="/apps/assets/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/apps/reset.css">
    <link rel="stylesheet" href="/apps/style.css">
  </head>
  <body>
    <div id="panel-header" class="panel-header"></div>
    <div id="grid-container" class="grid-container"></div>
    <div id="suggestion-strip" class="suggestion-strip hidden"></div>
    <script src="/apps/app.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("/apps/sw.js").catch((err) => {
          console.warn("SW registration failed:", err);
        });
      }
    </script>
  </body>
</html>
