name: Tauri Desktop Release

on:
  push:
    tags:
      - "v*"

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: npm install
        working-directory: packages/desktop

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Panna Cotta ${{ github.ref_name }}"
          releaseBody: ""
          releaseDraft: false
          prerelease: false
          projectPath: packages/desktop
          args: --target ${{ matrix.target }}

  update-homebrew-tap:
    needs: publish-tauri
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate cask
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node scripts/generate-homebrew-cask.mjs "$VERSION" --out panna-cotta.rb

      - name: Checkout tap
        uses: actions/checkout@v4
        with:
          repository: mike623/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }} # Requires contents write access to mike623/homebrew-tap only.
          path: homebrew-tap

      - name: Update tap cask
        run: |
          mkdir -p homebrew-tap/Casks
          cp panna-cotta.rb homebrew-tap/Casks/panna-cotta.rb
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/panna-cotta.rb
          git diff --cached --quiet && exit 0
          git commit -m "panna-cotta ${GITHUB_REF_NAME}"
          git push
