name: Tauri Desktop Release

on:
  push:
    branches:
      - main
    paths:
      - 'packages/desktop/src-tauri/tauri.conf.json'
      - 'packages/desktop/src-tauri/Cargo.toml'

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      tag: ${{ steps.get_version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Get version and create tag
        id: get_version
        run: |
          VERSION=$(node -p "require('./packages/desktop/src-tauri/tauri.conf.json').version")
          TAG="v$VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG" || echo "Tag $TAG already exists, skipping"
          git push origin "$TAG" || echo "Tag $TAG already pushed"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: npm install
        working-directory: packages/desktop

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ steps.get_version.outputs.tag }}
          releaseName: "Panna Cotta ${{ steps.get_version.outputs.tag }}"
          releaseBody: ""
          releaseDraft: false
          prerelease: false
          projectPath: packages/desktop
          args: --target ${{ matrix.target }}

  update-homebrew-tap:
    needs: publish-tauri
    if: always() && needs.publish-tauri.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate cask
        run: |
          VERSION="${{ needs.publish-tauri.outputs.version }}"
          node scripts/generate-homebrew-cask.mjs "$VERSION" --out panna-cotta.rb

      - name: Checkout tap
        uses: actions/checkout@v4
        with:
          repository: mike623/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }} # Requires contents write access to mike623/homebrew-tap only.
          path: homebrew-tap

      - name: Update tap cask
        run: |
          mkdir -p homebrew-tap/Casks
          cp panna-cotta.rb homebrew-tap/Casks/panna-cotta.rb
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/panna-cotta.rb
          git diff --cached --quiet && exit 0
          git commit -m "panna-cotta ${{ needs.publish-tauri.outputs.tag }}"
          git push
